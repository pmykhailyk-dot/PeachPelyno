[project]
name = "spry-backend"
version = "0.1.0"
description = "Spry API"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.31",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "boto3>=1.35",
    "anthropic[bedrock]>=0.69",
    "pyjwt[crypto]>=2.9",
]

[dependency-groups]
# Only the Lambda image (Dockerfile, target lambda) needs the ASGI adapter;
# the image Cloud Run and Compose run serves HTTP with uvicorn itself.
lambda = [
    "mangum>=0.22.0",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.9",
]

[tool.uv]
package = false
# Tests cover the Lambda handler too, so a plain `uv sync` installs both.
default-groups = ["dev", "lambda"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
