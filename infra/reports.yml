AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  Spry weekly meetings report (Lab 5): a report-builder Lambda in the VPC
  queries Aurora and writes a CSV to S3, woken by EventBridge Scheduler
  through an SQS queue (with a dead-letter queue) or by `make report-now`
  sending the same kind of message by hand. A report-mailer Lambda outside the
  VPC reacts to the file landing in S3 and emails it through SES - the two
  functions never call each other, only the S3 event connects them.

  Reuses what scripts/deploy-backend.sh already created: the backend's image
  (so the builder gets app.reports for free), its VPC subnets and security
  group (already allowed into Aurora's security group), and its database
  secret. Run make deploy-backend before this.

Parameters:
  ProjectName:
    Type: String
    Default: spry

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Same VPC as the backend function.

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Same subnets as the backend function.

  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: >-
      The backend function's security group - Aurora's security group already
      allows ingress from it, so the builder needs no new rule.

  RouteTableId:
    Type: String
    Description: >-
      Route table of the subnets above, so the S3 gateway endpoint can route
      PutObject there without a NAT gateway.

  ImageUri:
    Type: String
    Description: The backend's image URI (same one `make deploy-backend` just pushed).

  Architecture:
    Type: String
    Default: arm64
    AllowedValues: [arm64, x86_64]

  BuilderMemorySize:
    Type: Number
    Default: 512

  BuilderTimeoutSeconds:
    Type: Number
    Default: 60
    MinValue: 30
    Description: Leaves room for Aurora to resume from a pause (about 15 seconds).

  QueueVisibilityTimeoutSeconds:
    Type: Number
    Default: 360
    Description: >-
      At least 6x BuilderTimeoutSeconds - otherwise a message can become
      visible again while the first attempt is still running, and a second
      builder starts on the same report.

  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: SQLAlchemy async connection string - read from the backend's secret.

  ReportSenderEmail:
    Type: String
    Description: >-
      The From address, e.g. reports@your-domain or, without a domain, your
      own verified address (SES sandbox requires both sender and recipient
      verified either way).

  ReportRecipientEmail:
    Type: String
    Description: Where the report is sent.

  MailerSource:
    Type: String
    Description: Contents of infra/lambda/report_mailer.py, inlined by scripts/deploy-reports.sh.

  ScheduleExpression:
    Type: String
    Default: "cron(0 7 ? * MON *)"
    Description: When EventBridge Scheduler sends a report-request message.

  ScheduleTimezone:
    Type: String
    Default: Europe/Kyiv

  LogRetentionDays:
    Type: Number
    Default: 7

Conditions:
  RecipientDiffersFromSender: !Not [!Equals [!Ref ReportSenderEmail, !Ref ReportRecipientEmail]]

Resources:
  # --- storage -------------------------------------------------------------

  # Named explicitly, not with !GetAtt Bucket.Arn, so the Lambda::Permission
  # below can reference the ARN without a circular dependency: the permission
  # must exist before the bucket's notification config can point at it, and
  # the permission needs the bucket's ARN to exist.
  ReportsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    DependsOn: MailerS3InvokePermission
    Properties:
      BucketName: !Sub "${ProjectName}-reports-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-reports
            Status: Enabled
            Prefix: reports/
            ExpirationInDays: 90
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt MailerFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: reports/
                  - Name: suffix
                    Value: .csv
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ReportsBucketEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Gateway
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcId: !Ref VpcId
      RouteTableIds: [!Ref RouteTableId]

  # --- queue -----------------------------------------------------------------

  ReportRequestsDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-report-requests-dlq"
      MessageRetentionPeriod: 1209600 # 14 days
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ReportRequestsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-report-requests"
      VisibilityTimeout: !Ref QueueVisibilityTimeoutSeconds
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ReportRequestsDlq.Arn
        maxReceiveCount: 3
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # --- builder (in the VPC) ---------------------------------------------------

  BuilderLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-report-builder"
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  BuilderRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: write-reports
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}/reports/*"
        - PolicyName: consume-report-requests
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes]
                Resource: !GetAtt ReportRequestsQueue.Arn
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  BuilderFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-report-builder"
      Description: !Sub "${ProjectName} weekly report builder"
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      ImageConfig:
        Command: ["app.reports.lambda_handler.handler"]
      Architectures: [!Ref Architecture]
      MemorySize: !Ref BuilderMemorySize
      Timeout: !Ref BuilderTimeoutSeconds
      Role: !GetAtt BuilderRole.Arn
      LoggingConfig:
        LogGroup: !Ref BuilderLogGroup
      VpcConfig:
        SubnetIds: !Ref SubnetIds
        SecurityGroupIds: [!Ref SecurityGroupId]
      Environment:
        Variables:
          DATABASE_URL: !Ref DatabaseUrl
          DB_POOLING: "false"
          REPORTS_BUCKET: !Sub "${ProjectName}-reports-${AWS::AccountId}"
          LOG_LEVEL: INFO
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  BuilderEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt ReportRequestsQueue.Arn
      FunctionName: !Ref BuilderFunction
      BatchSize: 1

  # --- schedule ----------------------------------------------------------

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: scheduler.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: send-report-request
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt ReportRequestsQueue.Arn
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  WeeklySchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "${ProjectName}-weekly-report"
      ScheduleExpression: !Ref ScheduleExpression
      ScheduleExpressionTimezone: !Ref ScheduleTimezone
      FlexibleTimeWindow: {Mode: "OFF"}
      Target:
        Arn: !GetAtt ReportRequestsQueue.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"source":"schedule"}'

  # --- mailer (outside the VPC) --------------------------------------------

  MailerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-report-mailer"
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  MailerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: read-reports-and-send-mail
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}/reports/*"
              - Effect: Allow
                # sesv2.send_email with Content.Raw maps to the classic
                # SendRawEmail IAM action, not SendEmail - AWS keeps the old
                # action names even behind the new API.
                Action: [ses:SendEmail, ses:SendRawEmail]
                Resource: "*"
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  MailerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-report-mailer"
      Description: !Sub "${ProjectName} weekly report mailer"
      Runtime: python3.13
      Handler: index.handler
      Code:
        ZipFile: !Ref MailerSource
      Timeout: 30
      MemorySize: 256
      Role: !GetAtt MailerRole.Arn
      LoggingConfig:
        LogGroup: !Ref MailerLogGroup
      Environment:
        Variables:
          REPORT_SENDER: !Ref ReportSenderEmail
          REPORT_RECIPIENT: !Ref ReportRecipientEmail
          LOG_LEVEL: INFO
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  MailerS3InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref MailerFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub "arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}"
      SourceAccount: !Ref AWS::AccountId

  # --- SES identities ------------------------------------------------------
  # Sandbox-friendly simplification: no domain is attached to this project
  # (see .env), so there is no AWS::SES::EmailIdentity for a domain with DKIM
  # CNAMEs. One identity per distinct address is enough; each triggers an SES
  # verification email that has to be clicked before sending works.

  SenderIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref ReportSenderEmail

  RecipientIdentity:
    Type: AWS::SES::EmailIdentity
    Condition: RecipientDiffersFromSender
    Properties:
      EmailIdentity: !Ref ReportRecipientEmail

Outputs:
  ReportsBucketName:
    Value: !Ref ReportsBucket

  ReportRequestsQueueUrl:
    Value: !Ref ReportRequestsQueue

  ReportRequestsDlqUrl:
    Value: !Ref ReportRequestsDlq

  BuilderFunctionName:
    Value: !Ref BuilderFunction

  MailerFunctionName:
    Value: !Ref MailerFunction

  BuilderLogGroupName:
    Value: !Ref BuilderLogGroup

  MailerLogGroupName:
    Value: !Ref MailerLogGroup
